org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Caching disabled: a stale cached dex of kotlin-stdlib was missing SpillingKt.
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Give the per-library dexing transform the full classpath so D8 keeps stdlib
# classes referenced only by other libraries (e.g. the Meta SDK -> SpillingKt).
android.useFullClasspathForDexingTransform=true
