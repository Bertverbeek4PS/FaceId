name: Make signing keystore

# Run this ONCE, by hand, from the Actions tab.
#
# GitHub's runners are wiped after every job, so Gradle invents a new debug
# signing key on each build. Android treats a differently-signed APK as a
# different app and refuses to install it over the old one. Generating one
# keystore and committing it fixes that permanently: every future build is
# signed identically and installs as a normal update.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=Who Is There, O=Personal"
          ls -l keystore

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: keystore/debug.keystore
          if-no-files-found: error
