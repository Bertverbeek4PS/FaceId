name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Android SDK is already installed on GitHub's ubuntu runners,
      # so there is nothing to set up for it.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The face model is a 5 MB binary. Rather than committing it, the build
      # fetches it. If this step fails, the model has moved — see the message.
      - name: Fetch face recognition model
        run: |
          mkdir -p app/src/main/assets
          TARGET=app/src/main/assets/facenet.tflite
          URLS="
          https://github.com/shubham0204/FaceRecognition_With_FaceNet_Android/raw/master/app/src/main/assets/facenet.tflite
          https://github.com/shubham0204/OnDevice-Face-Recognition-Android/raw/main/app/src/main/assets/facenet.tflite
          "
          for url in $URLS; do
            echo "Trying $url"
            if curl -fsSL --retry 3 -o "$TARGET" "$url"; then
              break
            fi
          done
          if [ ! -s "$TARGET" ]; then
            echo "::error::Could not download facenet.tflite."
            echo "::error::Search GitHub for 'facenet.tflite', put the file in"
            echo "::error::app/src/main/assets/ and commit it, then remove this step."
            exit 1
          fi
          ls -lh "$TARGET"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check DAT credentials are present
        env:
          MWDAT_APPLICATION_ID: ${{ secrets.MWDAT_APPLICATION_ID }}
          MWDAT_CLIENT_TOKEN: ${{ secrets.MWDAT_CLIENT_TOKEN }}
        run: |
          # Print only lengths — the values are secrets and stay masked.
          appLen=${#MWDAT_APPLICATION_ID}
          tokLen=${#MWDAT_CLIENT_TOKEN}
          if [ "$appLen" -gt 0 ]; then echo "Application ID: set ($appLen chars)"; else echo "::warning::Application ID not set — build falls back to Developer Mode (0)"; fi
          if [ "$tokLen" -gt 0 ]; then echo "Client Token: set ($tokLen chars)"; else echo "::warning::Client Token not set — build falls back to Developer Mode (0)"; fi

      - name: Build debug APK
        # The Meta Wearables SDK lives on GitHub Packages and needs a personal
        # access token (classic) with read:packages. Add it as a repository
        # secret named MWDAT_GITHUB_TOKEN (Settings -> Secrets and variables ->
        # Actions). The built-in GITHUB_TOKEN cannot read another org's packages.
        env:
          GITHUB_TOKEN: ${{ secrets.MWDAT_GITHUB_TOKEN }}
          MWDAT_APPLICATION_ID: ${{ secrets.MWDAT_APPLICATION_ID }}
          MWDAT_CLIENT_TOKEN: ${{ secrets.MWDAT_CLIENT_TOKEN }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # Download from the run's Artifacts section (arrives as a zip).
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: who-is-there-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish to a fixed "latest" release, so there is a permanent
      # direct .apk link you can just open on the phone. No unzipping.
      - name: Publish to latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk who-is-there.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest who-is-there.apk \
            --title "Latest build" \
            --notes "Open this APK on your Android phone to install it."
